<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flappy Bird — Level Up Edition</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #2a2a4a, #10101f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    filter: drop-shadow(0 10px 40px rgba(0,0,0,0.6));
  }
  canvas {
    display: block;
    border: 5px solid #16161f;
    border-radius: 12px;
    transition: filter 0.3s;
  }
  #hud {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  #score {
    color: white;
    font-size: 42px;
    font-weight: 900;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.35), 0 0 10px rgba(255,255,255,0.2);
    letter-spacing: 1px;
  }
  #levelBadge {
    margin-top: 2px;
    padding: 3px 12px;
    background: rgba(0,0,0,0.35);
    border-radius: 20px;
    color: #ffe066;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 0.3s;
  }
  #levelBadge.show { opacity: 1; }
  #levelUpFlash {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    border-radius: 8px;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    background: rgba(10,10,20,0.55);
    backdrop-filter: blur(2px);
    border-radius: 8px;
    cursor: pointer;
  }
  #overlay h1 {
    font-size: 34px;
    margin: 0 0 6px 0;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
  }
  #overlay p {
    font-size: 15px;
    margin: 3px 0;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    opacity: 0.9;
  }
  #overlay .hint {
    margin-top: 14px;
    font-size: 13px;
    padding: 8px 18px;
    background: #ffcc33;
    color: #3a2a00;
    border-radius: 30px;
    font-weight: bold;
    box-shadow: 0 4px 0 #cc9900;
  }
  #muteBtn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game" width="360" height="540"></canvas>
  <button id="muteBtn">🔊</button>
  <div id="hud">
    <div id="score">0</div>
    <div id="levelBadge">LEVEL 1</div>
  </div>
  <div id="levelUpFlash"></div>
  <div id="overlay">
    <h1>🐦 Flappy Bird</h1>
    <p>Tekan SPASI, klik, atau tap untuk terbang</p>
    <p>Makin tinggi skormu, makin cepat & makin ganas!</p>
    <div class="hint">▶ KLIK UNTUK MULAI</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const levelBadge = document.getElementById('levelBadge');
const levelUpFlash = document.getElementById('levelUpFlash');
const muteBtn = document.getElementById('muteBtn');
const W = canvas.width, H = canvas.height;

// ================= AUDIO =================
let audioCtx = null;
let muted = false;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, duration, type = 'sine', startGain = 0.2, glide = 0) {
  if (muted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (glide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + glide), audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(startGain, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sfxFlap() { tone(520, 0.11, 'square', 0.12, 250); }
function sfxScore() {
  tone(880, 0.09, 'sine', 0.18);
  setTimeout(() => tone(1180, 0.12, 'sine', 0.16), 70);
}
function sfxLevelUp() {
  [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'triangle', 0.15), i * 80));
}
function sfxHit() {
  tone(140, 0.25, 'sawtooth', 0.22, -100);
  if (!muted && audioCtx) {
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    noise.connect(g).connect(audioCtx.destination);
    noise.start();
  }
}
muteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
});

// ================= THEMES =================
// Each theme: sky gradient stops, ground colors, pipe colors, cloud/deco color, bird palette, name
const THEMES = [
  { name: 'Pagi Cerah', sky: ['#4ec0ca', '#8fe0e6'], ground: ['#ded895', '#c9bd6e'], pipe: ['#5ec95e', '#3a8f3a'], deco: 'rgba(255,255,255,0.55)', bird: ['#ffcc33', '#e0a800'] },
  { name: 'Sore Jingga', sky: ['#ff9966', '#ffcc70'], ground: ['#e0a868', '#b8824a'], pipe: ['#e8734a', '#a8482a'], deco: 'rgba(255,230,200,0.5)', bird: ['#ff6b6b', '#c23c3c'] },
  { name: 'Senja Ungu', sky: ['#6a4c93', '#b185a7'], ground: ['#7d5c8a', '#5c4266'], pipe: ['#a463c9', '#6b3a99'], deco: 'rgba(255,255,255,0.35)', bird: ['#ffd93d', '#d4a017'] },
  { name: 'Malam Kota', sky: ['#0f1b3c', '#2a3d6b'], ground: ['#2e2e46', '#1c1c2e'], pipe: ['#4a5a9e', '#2c3868'], deco: 'rgba(255,255,255,0.7)', bird: ['#ffe066', '#e0a800'], stars: true },
  { name: 'Badai Neon', sky: ['#1a0033', '#3d0066'], ground: ['#33004d', '#1a0033'], pipe: ['#ff2ee6', '#9900cc'], deco: 'rgba(0,255,255,0.5)', bird: ['#00ffcc', '#00997a'], stars: true, neon: true },
];
function themeForLevel(lvl) {
  return THEMES[Math.min(lvl - 1, THEMES.length - 1)];
}

// ================= GAME CONFIG =================
const GRAVITY = 0.45;
const FLAP = -8;
const BASE_PIPE_GAP = 145;
const PIPE_WIDTH = 60;
const GROUND_HEIGHT = H * 0.2;
const POINTS_PER_LEVEL = 5;

let bird, pipes, frame, score, best, gameState, level, particles, shake, stars, lastTheme;
best = Number(localStorage.getItem('flappyBest') || 0);

function currentDifficulty() {
  // scales with level: speed up, gap shrinks, slightly faster spawn
  const speed = 2.6 + level * 0.45;
  const gap = Math.max(96, BASE_PIPE_GAP - level * 7);
  const spacingFrames = Math.max(58, 82 - level * 4);
  return { speed, gap, spacingFrames };
}

function makeStars() {
  const arr = [];
  for (let i = 0; i < 40; i++) {
    arr.push({ x: Math.random() * W, y: Math.random() * (H - GROUND_HEIGHT) * 0.8, r: Math.random() * 1.5 + 0.5, tw: Math.random() * Math.PI * 2 });
  }
  return arr;
}

function resetGame() {
  bird = { x: 80, y: H / 2, r: 14, vy: 0, rotation: 0 };
  pipes = [];
  frame = 0;
  score = 0;
  level = 1;
  particles = [];
  shake = 0;
  stars = makeStars();
  lastTheme = 0;
  gameState = 'ready';
  scoreEl.textContent = '0';
  levelBadge.textContent = 'LEVEL 1';
  levelBadge.classList.remove('show');
  overlay.style.display = 'flex';
  overlay.innerHTML = '<h1>🐦 Flappy Bird</h1><p>Tekan SPASI, klik, atau tap untuk terbang</p><p>Makin tinggi skormu, makin cepat & makin ganas!</p><div class="hint">▶ KLIK UNTUK MULAI</div>';
}

function flap() {
  ensureAudio();
  if (gameState === 'ready') {
    gameState = 'playing';
    overlay.style.display = 'none';
  }
  if (gameState === 'playing') {
    bird.vy = FLAP;
    sfxFlap();
    spawnParticles(bird.x - 6, bird.y + 4, 3);
  }
  if (gameState === 'over') {
    resetGame();
  }
}

function spawnParticles(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: -1 - Math.random() * 1.5,
      vy: (Math.random() - 0.5) * 1.5,
      life: 20 + Math.random() * 10,
      maxLife: 30,
      r: 2 + Math.random() * 2
    });
  }
}

function spawnPipe() {
  const { gap } = currentDifficulty();
  const minTop = 40;
  const maxTop = H - GROUND_HEIGHT - gap - 40;
  const topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
  pipes.push({ x: W, top: topHeight, passed: false, gap });
}

function checkLevelUp() {
  const newLevel = Math.floor(score / POINTS_PER_LEVEL) + 1;
  if (newLevel !== level) {
    level = newLevel;
    levelBadge.textContent = 'LEVEL ' + level + ' — ' + themeForLevel(level).name.toUpperCase();
    levelBadge.classList.add('show');
    sfxLevelUp();
    flashScreen();
    clearTimeout(checkLevelUp._t);
    checkLevelUp._t = setTimeout(() => levelBadge.classList.remove('show'), 2200);
  }
}

function flashScreen() {
  levelUpFlash.style.transition = 'none';
  levelUpFlash.style.opacity = '0.85';
  requestAnimationFrame(() => {
    levelUpFlash.style.transition = 'opacity 0.6s';
    levelUpFlash.style.opacity = '0';
  });
  shake = 8;
}

function update() {
  if (gameState !== 'playing') return;
  frame++;

  const { speed, spacingFrames } = currentDifficulty();

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rotation = Math.max(-0.5, Math.min(1.3, bird.vy * 0.08));

  if (frame % spacingFrames === 0) spawnPipe();

  for (const p of pipes) {
    p.x -= speed;
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
      sfxScore();
      checkLevelUp();
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);

  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy; pt.life--;
  }
  particles = particles.filter(p => p.life > 0);

  if (shake > 0) shake *= 0.85;

  if (bird.y + bird.r > H - GROUND_HEIGHT || bird.y - bird.r < 0) {
    endGame();
    return;
  }
  for (const p of pipes) {
    const withinX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_WIDTH;
    if (withinX) {
      const hitsTop = bird.y - bird.r < p.top;
      const hitsBottom = bird.y + bird.r > p.top + p.gap;
      if (hitsTop || hitsBottom) { endGame(); return; }
    }
  }
}

function endGame() {
  gameState = 'over';
  sfxHit();
  shake = 14;
  if (score > best) {
    best = score;
    localStorage.setItem('flappyBest', best);
  }
  overlay.style.display = 'flex';
  overlay.innerHTML =
    '<h1>💥 Game Over</h1>' +
    '<p>Skor: ' + score + ' &nbsp;|&nbsp; Level dicapai: ' + level + '</p>' +
    '<p>Rekor terbaik: ' + best + '</p>' +
    '<div class="hint">▶ MAIN LAGI</div>';
}

// ================= DRAWING =================
function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 255, ag = (ah >> 8) & 255, ab = ah & 255;
  const br = (bh >> 16) & 255, bg = (bh >> 8) & 255, bb = bh & 255;
  const r = Math.round(ar + (br - ar) * t), g = Math.round(ag + (bg - ag) * t), b2 = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${b2})`;
}

function drawSky() {
  const theme = themeForLevel(level);
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
  grad.addColorStop(0, theme.sky[0]);
  grad.addColorStop(1, theme.sky[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

  if (theme.stars) {
    for (const s of stars) {
      const alpha = 0.4 + Math.sin(frame * 0.05 + s.tw) * 0.3;
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, alpha)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawClouds() {
  const theme = themeForLevel(level);
  ctx.fillStyle = theme.deco;
  const t = frame * 0.25;
  for (let i = 0; i < 3; i++) {
    const cx = ((i * 150 - t) % (W + 100) + (W + 100)) % (W + 100) - 50;
    const cy = 55 + i * 45;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 30, 14, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 20, cy + 4, 20, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGround() {
  const theme = themeForLevel(level);
  ctx.fillStyle = theme.ground[0];
  ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
  ctx.fillStyle = theme.ground[1];
  const stripeW = 20;
  const { speed } = currentDifficulty();
  const offset = (frame * (gameState === 'playing' ? speed : 0)) % stripeW;
  for (let x = -offset; x < W; x += stripeW) {
    ctx.fillRect(x, H - GROUND_HEIGHT, 10, 8);
  }
  // top edge highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(0, H - GROUND_HEIGHT, W, 3);
}

function drawPipe(p) {
  const theme = themeForLevel(level);
  ctx.fillStyle = theme.pipe[0];
  ctx.strokeStyle = theme.pipe[1];
  ctx.lineWidth = 3;

  ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
  ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
  ctx.fillRect(p.x - 4, p.top - 20, PIPE_WIDTH + 8, 20);
  ctx.strokeRect(p.x - 4, p.top - 20, PIPE_WIDTH + 8, 20);

  const bottomY = p.top + p.gap;
  const bottomH = H - GROUND_HEIGHT - bottomY;
  ctx.fillRect(p.x, bottomY, PIPE_WIDTH, bottomH);
  ctx.strokeRect(p.x, bottomY, PIPE_WIDTH, bottomH);
  ctx.fillRect(p.x - 4, bottomY, PIPE_WIDTH + 8, 20);
  ctx.strokeRect(p.x - 4, bottomY, PIPE_WIDTH + 8, 20);

  if (theme.neon) {
    ctx.save();
    ctx.shadowColor = theme.pipe[0];
    ctx.shadowBlur = 14;
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.strokeRect(p.x, bottomY, PIPE_WIDTH, bottomH);
    ctx.restore();
  }

  // highlight strip
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(p.x + 6, 0, 6, p.top);
  ctx.fillRect(p.x + 6, bottomY, 6, bottomH);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBird() {
  const theme = themeForLevel(level);
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);

  if (theme.neon) {
    ctx.shadowColor = theme.bird[0];
    ctx.shadowBlur = 16;
  }

  ctx.fillStyle = theme.bird[0];
  ctx.beginPath();
  ctx.ellipse(0, 0, bird.r, bird.r * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = theme.bird[1];
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  const flapOffset = gameState === 'playing' ? Math.sin(frame * 0.4) * 4 : 0;
  ctx.ellipse(-4, 2 + flapOffset, 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(6, -4, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(7.5, -4, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff9900';
  ctx.beginPath();
  ctx.moveTo(bird.r - 2, -2);
  ctx.lineTo(bird.r + 8, 0);
  ctx.lineTo(bird.r - 2, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  ctx.clearRect(-20, -20, W + 40, H + 40);
  drawSky();
  drawClouds();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawParticles();
  drawBird();
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });
overlay.addEventListener('click', flap);

resetGame();
loop();
</script>
</body>
</html>
